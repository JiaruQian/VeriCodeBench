config:
  task: verina_proof
  problems: data/verina.jsonl
  n_attempts: 4
  max_turns: 16
  n_worker_threads: 10

  model: vllm-gptoss
  temperature: 1.0

  # vLLM server configuration (auto-start mode)
  vllm_model_path: openai/gpt-oss-120b  # or local path to model
  vllm_tensor_parallel_size: 8  # Use 8 GPUs for this large model
  vllm_server_timeout: 600.0  # Larger models need more time to load
  vllm_extra_args:
    gpu-memory-utilization: 0.9
    max-model-len: 131072
    tool-call-parser: openai
    enable-auto-tool-choice: null

  use_mcp: false
  use_loogle: false
  use_leanexplore: false
